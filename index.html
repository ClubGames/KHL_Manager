<!doctype html>
<html lang="ru" style="background:#0b1420;color:#e8eef5">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1420" />
    <meta name="description" content="КХЛ Генеральный менеджер — хоккейный симулятор управления клубом: звенья, обмены, плей-офф Кубка Гагарина. Ростер загружается из roster.json." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1420'/%3E%3Cellipse cx='16' cy='12' rx='11' ry='5' fill='%23e5323e'/%3E%3Cpath d='M5 12v8c0 2.8 4.9 5 11 5s11-2.2 11-5v-8' fill='%23b8202c'/%3E%3Cellipse cx='16' cy='12' rx='7' ry='3' fill='%230b1420' opacity='.25'/%3E%3C/svg%3E" />
    <title>КХЛ Генеральный менеджер — хоккейный симулятор</title>
    <style>
      html, body { background: #0b1420; color: #e8eef5; margin: 0; padding: 0; }
      @keyframes khlBootHint { to { opacity: 1; } }
      .khl-boot-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; box-sizing: border-box; }
      .khl-boot-hint { max-width: 440px; margin-top: 16px; padding: 14px 16px; border: 1px solid #24354f; border-radius: 6px; background: #121d2e; color: #93a4bc; font-size: 13px; line-height: 1.5; opacity: 0; animation: khlBootHint 0.25s ease 3.5s forwards; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="khl-boot-wrap">
        <div style="font-weight:700;font-size:16px;letter-spacing:0.04em">КХЛ ГЕНЕРАЛЬНЫЙ МЕНЕДЖЕР</div>
        <div style="color:#93a4bc;font-size:13px;margin-top:6px">Загрузка интерфейса…</div>
        <div class="khl-boot-hint">
          Если игра не запустилась: убедитесь, что на GitHub Pages выбран источник <b>GitHub Actions</b> (а не исходная ветка <code>main</code>), либо откройте ссылку в браузере Safari / Chrome (встроенный предпросмотр файлов Telegram/iOS блокирует скрипты).
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
